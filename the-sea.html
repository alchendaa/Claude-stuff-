<meta name="claude:viewport-fit-sides" content="cover">

<style>

#sea{background:var(--black)}

#cap.low{bottom:calc(8.5% + env(safe-area-inset-bottom,0px))}
#cap .ln{max-width:34ch;font-size:clamp(14px,4.1vw,21px);line-height:1.55;letter-spacing:.01em;color:var(--paper);text-shadow:0 0 12px rgba(2,3,8,.9),0 1px 2px rgba(2,3,8,.9)}
#cap.q .ln{max-width:22ch;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(22px,6.3vw,36px);line-height:1.22;letter-spacing:0;color:var(--warm);text-wrap:balance}
#cap .off{visibility:hidden}

.card.off{opacity:0;pointer-events:none}

.btn::before{content:"";border-left:9px solid var(--paper);border-top:6px solid transparent;border-bottom:6px solid transparent}
.btn:hover,.btn:active{background:var(--paper);color:var(--black)}

   float gr=vnoise(gl_FragCoord.xy*.55)*.6+vnoise(vec2(p.x*60.,p.y*260.))*.4;

function breathAt(t){

setInterval(schedule,40);

/* ================= playback ================= */
let state='poster',filmT=0,t0=0,useAudio=false,paused=false,wake=null;
function attachAudio(){const c=AU.ctx;useAudio=true;t0=c.currentTime+(filmT<=0?.12:0)-filmT;scIdx=lower(filmT);seaSetup(Math.max(0,filmT));}
function begin(t){filmT=t;paused=false;useAudio=false;state='playing';capKey='';
  if(AU.ctx&&AU.ctx.state==='running')attachAudio();
  endShown=false;document.body.classList.remove('poster');$('poster').classList.add('off');$('end').classList.add('off');$('paused').classList.add('off');
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{wake=w;}).catch(()=>{});}catch(e){}
}
async function play(){audioInit();if(AU.ctx){try{await Promise.race([AU.ctx.resume(),new Promise(r=>setTimeout(r,700))]);}catch(e){}}begin(0);}
function finish(){state='ended';endShown=true;$('end').classList.remove('off');try{if(wake)wake.release();}catch(e){}wake=null;}
function setPaused(p){
  if(state!=='playing'||p===paused)return;paused=p;$('paused').classList.toggle('off',!p);
  if(AU.ctx){if(p)AU.ctx.suspend().catch(()=>{});else AU.ctx.resume().catch(()=>{});}
}
$('play').addEventListener('click',play);$('again').addEventListener('click',play);
addEventListener('pointerup',e=>{if(state!=='playing'||filmT<.6||filmT>=126)return;if(e.target&&e.target.closest&&e.target.closest('button'))return;setPaused(!paused);});
addEventListener('keydown',e=>{if(e.key===' '&&state==='playing'&&document.activeElement.tagName!=='BUTTON'){setPaused(!paused);e.preventDefault();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});

let last=0,acc=0,frames=0,endShown=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=last?Math.min((now-last)/1000,.1):.016;last=now;
  resize(false);
  let t;
  if(state==='playing'){
    if(useAudio)filmT=AU.ctx.currentTime-t0;
    else{if(!paused)filmT+=dt;if(!paused&&AU.ctx&&AU.ctx.state==='running')attachAudio();}
    if(filmT>=END){filmT=END;finish();}
    t=Math.max(0,filmT);
    if(expAt(t)>0&&!paused){acc+=dt;frames++;if(frames>=80){if(acc/frames>.024&&quality>.5){quality*=.82;resize(true);}acc=0;frames=0;}}
  }else if(state==='poster')t=37.6+(now/1000)%5;
  else t=END;
  drawSea(state==='poster'?0:t);
  drawInk(t);
  if(state==='playing'){drawCaptions(t);$('scrim').style.opacity=Math.max(expAt(t)*.9,sm(t,52,58)*(1-sm(t,123,126))*.85).toFixed(3);const sh=t>=126.5;if(sh!==endShown){endShown=sh;$('end').classList.toggle('off',!sh);}}
  else if(capKey!=='none'){capKey='none';cap.style.opacity=0;$('scrim').style.opacity=0;}
}
document.body.classList.add('poster');
resize(true);
if(document.fonts&&document.fonts.load){document.fonts.load('500 16px "IBM Plex Mono"');document.fonts.load('italic 600 16px "Cormorant Garamond"');}
window.__film={seek(t){if(state!=='playing')begin(t);filmT=t;capKey='';if(useAudio){t0=AU.ctx.currentTime-t;scIdx=lower(t);seaSetup(t);}},get t(){return filmT;},get state(){return state;},pause:setPaused};
requestAnimationFrame(frame);
})();
</script>
