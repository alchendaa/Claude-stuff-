<title>Starwake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Syncopate:wght@700&display=swap">
<style>
/* Layout: one full-bleed WebGL world. Type floats over it: name high, call to action low, flight readouts pinned to the top corners. */
:root{
  color-scheme:dark;
  --void:#04030c;
  --ink:#f4f1ff;
  --dim:#b3aed4;
  --ion:#6ff3ff;
  --flare:#ff5fa8;
  --gold:#ffd97a;
  --display:'Syncopate','Eurostile','Arial Black',system-ui,sans-serif;
  --body:'Chakra Petch','Avenir Next',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;
  padding-block:calc(8vh + env(safe-area-inset-top,0px)) calc(6vh + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;transition:opacity .55s ease,transform .55s ease}
.screen.off{opacity:0;transform:scale(1.05)}
.kicker{font-size:11px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--ion);text-shadow:0 0 14px rgba(111,243,255,.55)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,11.2vw,92px);line-height:1;letter-spacing:.06em;margin-right:-.06em;
  background:linear-gradient(180deg,var(--ink) 18%,var(--ion) 58%,var(--flare) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(111,243,255,.38))}
.tag{max-width:34ch;font-size:15px;line-height:1.5;color:var(--ink);text-shadow:0 1px 14px var(--void),0 0 3px var(--void);text-wrap:balance}
.spacer{flex:1}
.cta{font-family:var(--display);font-size:15px;letter-spacing:.34em;margin-right:-.34em;color:var(--ink);text-shadow:0 0 20px var(--ion),0 0 4px var(--ion);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.45;transform:translateY(3px)}}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;max-width:420px;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 10px var(--void)}
.how b{color:var(--gold);font-weight:600}

.final{font-family:var(--display);font-size:clamp(40px,15vw,120px);line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 34px rgba(255,95,168,.6)}
.stats{display:flex;gap:26px;justify-content:center}
.stats div{display:flex;flex-direction:column;gap:4px;min-width:64px}
.stats b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--gold)}
.stats small{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
#over .kicker{color:var(--flare);text-shadow:0 0 14px rgba(255,95,168,.6)}

#hud{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;transition:opacity .4s}
#hud.off{opacity:0}
.lbl{font-size:10px;font-weight:600;letter-spacing:.3em;color:var(--dim)}
#score{font-family:var(--display);font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(111,243,255,.6)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#mult{font-family:var(--display);font-size:20px;line-height:1.3;color:var(--gold);text-shadow:0 0 16px rgba(255,217,122,.6);transform-origin:right center}
#mult.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
#flow{width:78px;height:3px;border-radius:2px;background:rgba(244,241,255,.18);overflow:hidden}
#flow i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold);transition:width .15s}
#shields{display:flex;gap:9px;padding:3px 3px 0 0}
#shields i{width:10px;height:10px;transform:rotate(45deg);background:var(--ion);box-shadow:0 0 10px var(--ion);transition:background .3s,box-shadow .3s}
#shields i.gone{background:transparent;box-shadow:inset 0 0 0 1px rgba(244,241,255,.4)}

#toast{position:fixed;left:0;right:0;top:calc(21% + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;font-family:var(--display);font-size:13px;letter-spacing:.4em;color:var(--ink);opacity:0;transform:translateY(8px);
  transition:opacity .5s,transform .5s;pointer-events:none;text-shadow:0 0 18px rgba(244,241,255,.7)}
#toast.show{opacity:1;transform:none}
#toast small{display:block;margin-bottom:8px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.34em;color:var(--ion)}

#mute{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(244,241,255,.3);background:rgba(4,3,12,.45);color:var(--ink);font:600 11px var(--body);letter-spacing:.08em;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#mute:focus-visible{outline:2px solid var(--ion);outline-offset:3px}
#mute[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.cta{animation:none}}
</style>

<canvas id="gl"></canvas>

<div id="hud" class="off">
  <div>
    <div class="lbl">SCORE</div>
    <div id="score">0</div>
  </div>
  <div class="right">
    <div id="mult">x1</div>
    <div id="flow"><i id="flowBar"></i></div>
    <div id="shields"><i></i><i></i><i></i></div>
  </div>
</div>

<div id="toast"></div>

<div id="title" class="screen">
  <div class="kicker">An original game by Claude</div>
  <h1>STARWAKE</h1>
  <p class="tag" id="tag">Every mountain, every light and every note of the soundtrack is generated live on your device. No engine, no assets, one file.</p>
  <div class="spacer"></div>
  <div class="cta" id="cta">TAP TO FLY</div>
  <div class="how"><span><b>Drag</b> to steer</span><span><b>Collect</b> light</span><span><b>Thread</b> rings</span><span><b>Dodge</b> crystal</span></div>
</div>

<div id="over" class="screen off">
  <div class="kicker">Signal lost</div>
  <div class="final" id="final">0</div>
  <div class="stats">
    <div><b id="oDist">0 m</b><small>Distance</small></div>
    <div><b id="oOrbs">0</b><small>Light</small></div>
    <div><b id="oBest">0</b><small>Best</small></div>
  </div>
  <div class="spacer"></div>
  <div class="cta">TAP TO FLY AGAIN</div>
</div>

<button id="mute" type="button" aria-label="Sound" aria-pressed="false">SND</button>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,mod=(a,n)=>((a%n)+n)%n,rnd=(a,b)=>a+Math.random()*(b-a);
const hex=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const ADAPT=location.hash!=='#hq';

const canvas=$('gl');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){$('tag').textContent='This device does not support WebGL 2, which Starwake needs to draw its world.';$('cta').hidden=true;return;}

/* ================= shaders ================= */
const HEAD='#version 300 es\nprecision highp float;\n';
const NOISE=`
float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error('shader',gl.getShaderInfoLog(s),'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,HEAD+vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,HEAD+fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error('link',gl.getProgramInfoLog(p));
  const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name);}return{p,u};}

const FSQ=`layout(location=0) in vec2 aPos;out vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`;

const skyP=prog(`layout(location=0) in vec2 aPos;out vec2 vUv;void main(){vUv=aPos;gl_Position=vec4(aPos,.99999,1.);}`,`
in vec2 vUv;out vec4 o;
uniform vec3 uR,uU,uF,uTop,uHor,uGlow,uAccent,uPlanet;uniform vec2 uTan;uniform float uTime,uBeat;
${NOISE}
void main(){
 vec3 rd=normalize(uF+uR*vUv.x*uTan.x+uU*vUv.y*uTan.y);
 float y=max(rd.y,0.);
 vec3 col=mix(uHor,uTop,pow(clamp(y*1.2,0.,1.),.55))+uGlow*exp(-y*9.)*.5;
 vec3 base=col;
 vec2 sp=vec2(atan(rd.x,-rd.z),asin(clamp(rd.y,-1.,1.)));
 vec2 g=sp*38.;vec2 id=floor(g);vec2 f=fract(g)-.5;
 float h=hash(id);
 vec2 off=(vec2(hash(id+3.1),hash(id+7.7))-.5)*.7;
 float tw=.6+.4*sin(uTime*(1.5+h*4.)+h*40.);
 float star=(1.-smoothstep(0.,.05+.09*h,length(f-off)))*step(.8,h)*tw*(.4+(h-.8)*4.);
 col+=star*smoothstep(.02,.22,rd.y)*mix(vec3(1.),uAccent,hash(id+1.3)*.5)*1.7;
 float n1=vnoise(vec2(sp.x*3.4+uTime*.05,uTime*.03));
 float curtain=vnoise(vec2(sp.x*14.+n1*3.,uTime*.11));
 float band=smoothstep(.07,.3,rd.y)*(1.-smoothstep(.4,.95,rd.y));
 float rays=.55+.45*vnoise(vec2(sp.x*70.,rd.y*3.-uTime*.25));
 col+=uAccent*pow(curtain,2.6)*band*(.5+.7*n1)*rays*(.6+uBeat*.3);
 vec3 pd=normalize(vec3(-.22,.34,-1.));
 vec3 px=normalize(cross(pd,vec3(0.,1.,0.)));vec3 py=cross(px,pd);
 float t=dot(rd,pd);
 if(t>0.){
  vec2 d=vec2(dot(rd,px),dot(rd,py))/t/.2;
  float r2=dot(d,d);
  if(r2<9.){
   float inD=step(r2,1.);
   col+=uGlow*.2*exp(-max(sqrt(r2)-1.,0.)*5.)*(1.-inD);
   if(r2<1.){
    vec3 n=vec3(d,sqrt(1.-r2));
    float df=smoothstep(-.1,.6,dot(n,normalize(vec3(.75,.42,.35))));
    float bands=vnoise(vec2(n.y*7.+vnoise(n.xy*3.+uTime*.01)*1.3,2.+uTime*.004));
    vec3 lit=uPlanet*(.36+.56*bands)*df+uGlow*pow(1.-n.z,2.5)*.5*df;
    col=mix(col,base*.25+lit,1.-smoothstep(.95,1.,r2));
   }
   vec2 dr=vec2(.9287*d.x+.3709*d.y,-.3709*d.x+.9287*d.y);
   float rr=length(vec2(dr.x,dr.y*3.4));
   float ring=smoothstep(1.32,1.42,rr)*(1.-smoothstep(2.2,2.36,rr));
   ring*=.4+.6*vnoise(vec2(rr*24.,3.));
   ring*=1.-.85*smoothstep(1.76,1.79,rr)*(1.-smoothstep(1.85,1.88,rr));
   float vis=ring*max(step(dr.y,0.),1.-inD);
   col=mix(col,uPlanet*.85+.05,vis*.7);
  }
 }
 o=vec4(col,1.);
}`);

const terP=prog(`
layout(location=0) in vec2 aGrid;
uniform mat4 uVP;uniform float uCell,uSnapZ;
out vec3 vW;
${NOISE}
float terrainH(vec2 p){
 float ax=abs(p.x);
 float m=smoothstep(8.,36.,ax);
 float n=vnoise(p*.035)*.55+vnoise(p*.09)*.3+vnoise(p*.21)*.15;
 float rg=1.-abs(2.*vnoise(p*.026+11.)-1.);
 float h=m*(n*19.+rg*rg*17.+(ax-8.)*.14);
 h+=(vnoise(p*.23)-.5)*.5*(1.-m);
 return h;
}
void main(){
 vec2 p=vec2(aGrid.x*uCell,uSnapZ-aGrid.y*uCell);
 vW=vec3(p.x,terrainH(p),p.y);
 gl_Position=uVP*vec4(vW,1.);
}`,`
in vec3 vW;out vec4 o;
uniform vec3 uCam,uFog,uLow,uHigh,uGrid,uAccent,uLight;uniform float uBeat,uPulseZ;
void main(){
 vec3 n=normalize(cross(dFdx(vW),dFdy(vW)));if(n.y<0.)n=-n;
 float diff=max(dot(n,uLight),0.);
 float hf=clamp(vW.y/34.,0.,1.);
 vec3 col=mix(uLow,uHigh,hf)*(.3+1.1*diff);
 vec2 gc=vW.xz/4.;vec2 gw=fwidth(gc)*1.5;
 vec2 gd=abs(fract(gc-.5)-.5)/max(gw,vec2(1e-4));
 float line=1.-min(min(gd.x,gd.y),1.);
 float d=length(vW-uCam);
 float lf=exp(-d*.011);
 float pulse=exp(-abs(vW.z-uPulseZ)*.1);
 vec2 g2=vW.xz;vec2 gd2=abs(fract(g2-.5)-.5)/max(fwidth(g2)*1.2,vec2(1e-4));
 float sub=(1.-min(min(gd2.x,gd2.y),1.))*exp(-d*.07);
 col+=uGrid*line*(.3+.75*uBeat+1.6*pulse)*lf+uGrid*sub*(.1+.25*pulse);
 col+=uGrid*pulse*.07*lf;
 col+=uAccent*smoothstep(.5,1.,hf)*.3*(.4+.6*diff);
 col=mix(col,uFog,1.-exp(-pow(d/125.,2.)));
 o=vec4(col,1.);
}`);

const objP=prog(`
layout(location=0) in vec3 aPos;
layout(location=1) in vec4 iPos;
layout(location=2) in vec3 iScale;
layout(location=3) in vec3 iRot;
layout(location=4) in vec4 iCol;
uniform mat4 uVP;
out vec3 vW;out vec3 vL;out vec4 vCol;out float vGrad;
void main(){
 float cx=cos(iRot.x),sx=sin(iRot.x),cy=cos(iRot.y),sy=sin(iRot.y),cz=cos(iRot.z),sz=sin(iRot.z);
 mat3 X=mat3(1.,0.,0., 0.,cx,sx, 0.,-sx,cx);
 mat3 Y=mat3(cy,0.,-sy, 0.,1.,0., sy,0.,cy);
 mat3 Z=mat3(cz,sz,0., -sz,cz,0., 0.,0.,1.);
 vec3 p=Y*X*Z*(aPos*iScale);
 vW=p+iPos.xyz;vL=aPos;vCol=iCol;vGrad=iPos.w;
 gl_Position=uVP*vec4(vW,1.);
}`,`
in vec3 vW;in vec3 vL;in vec4 vCol;in float vGrad;out vec4 o;
uniform vec3 uCam,uFog,uLight,uRim;
void main(){
 vec3 n=normalize(cross(dFdx(vW),dFdy(vW)));
 vec3 v=normalize(uCam-vW);
 if(dot(n,v)<0.)n=-n;
 float diff=max(dot(n,uLight),0.);
 float fres=pow(1.-max(dot(n,v),0.),3.);
 float g=mix(1.,clamp(vL.y,0.,1.),vGrad);g*=g;
 vec3 col=vCol.rgb*(.12+.55*diff)+vCol.rgb*vCol.a*(.15+1.2*g)+uRim*fres*.6;
 float d=length(uCam-vW);
 col=mix(col,uFog,1.-exp(-pow(d/125.,2.)));
 o=vec4(col,1.);
}`);

const sprP=prog(`
layout(location=0) in vec2 aC;
layout(location=1) in vec4 iPos;
layout(location=2) in vec4 iCol;
layout(location=3) in float iLen;
uniform mat4 uVP;uniform vec3 uR,uU,uCam;
out vec2 vUv;out vec3 vCol;out float vKind;
void main(){
 vec3 up=iLen>0.?vec3(0.,0.,iLen):uU*iPos.w;
 vec3 wp=iPos.xyz+uR*aC.x*iPos.w+up*aC.y;
 float d=length(wp-uCam);
 vCol=iCol.rgb*exp(-pow(d/130.,2.));
 vKind=iCol.a;vUv=aC;
 gl_Position=uVP*vec4(wp,1.);
}`,`
in vec2 vUv;in vec3 vCol;in float vKind;out vec4 o;
void main(){
 float r=length(vUv);
 float glow=(exp(-r*r*5.)*.85+(1.-smoothstep(0.,.32,r))*1.5)*(1.-smoothstep(.6,1.,r));
 float streak=pow(1.-abs(vUv.x),2.)*(1.-vUv.y*vUv.y);
 o=vec4(vCol*mix(glow,streak,vKind),1.);
}`);

const brightP=prog(FSQ,`
in vec2 vUv;out vec4 o;uniform sampler2D uT;uniform vec2 uPx;
void main(){
 vec3 c=texture(uT,vUv+uPx*vec2(-1.,-1.)).rgb+texture(uT,vUv+uPx*vec2(1.,-1.)).rgb+texture(uT,vUv+uPx*vec2(-1.,1.)).rgb+texture(uT,vUv+uPx).rgb;
 c*=.25;float l=max(c.r,max(c.g,c.b));
 o=vec4(c*smoothstep(.62,1.25,l),1.);
}`);
const blurP=prog(FSQ,`
in vec2 vUv;out vec4 o;uniform sampler2D uT;uniform vec2 uD;
void main(){
 vec3 c=texture(uT,vUv).rgb*.227027;
 c+=(texture(uT,vUv+uD*1.384615).rgb+texture(uT,vUv-uD*1.384615).rgb)*.316216;
 c+=(texture(uT,vUv+uD*3.230769).rgb+texture(uT,vUv-uD*3.230769).rgb)*.07027;
 o=vec4(c,1.);
}`);
const compP=prog(FSQ,`
in vec2 vUv;out vec4 o;
uniform sampler2D uS,uB1,uB2;uniform float uCA,uFlash,uTime;uniform vec3 uFlashCol;uniform vec2 uRes;
${NOISE}
void main(){
 vec2 c=vUv-.5;float r2=dot(c,c);
 vec2 ca=c*r2*uCA;
 vec3 col=vec3(texture(uS,vUv+ca).r,texture(uS,vUv).g,texture(uS,vUv-ca).b);
 col+=texture(uB1,vUv).rgb*.6+texture(uB2,vUv).rgb*.8;
 col+=uFlashCol*uFlash;
 col=1.-exp(-col*1.55);
 col*=1.-r2*.85;
 col+=(hash(vUv*uRes+fract(uTime)*91.7)-.5)*.03;
 o=vec4(col,1.);
}`);

/* ================= geometry ================= */
const triVAO=gl.createVertexArray();gl.bindVertexArray(triVAO);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const CELL=2,NX=76,NZ=132;
const terVAO=gl.createVertexArray();let terCount=0;
{gl.bindVertexArray(terVAO);
 const v=new Float32Array((NX+1)*(NZ+1)*2);let k=0;
 for(let j=0;j<=NZ;j++)for(let i=0;i<=NX;i++){v[k++]=i-NX/2;v[k++]=j;}
 const idx=new Uint16Array(NX*NZ*6);k=0;
 for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){const a=j*(NX+1)+i,b=a+1,c=a+NX+1,d=c+1;idx[k++]=a;idx[k++]=b;idx[k++]=c;idx[k++]=b;idx[k++]=d;idx[k++]=c;}
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,v,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
 terCount=idx.length;}

function crystalMesh(){const v=[],N=6;
  for(let i=0;i<N;i++){const a0=i/N*TAU,a1=(i+1)/N*TAU,c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    v.push(c0,0,s0, c1,0,s1, c1*.74,.7,s1*.74,  c0,0,s0, c1*.74,.7,s1*.74, c0*.74,.7,s0*.74,  c0*.74,.7,s0*.74, c1*.74,.7,s1*.74, 0,1,0);}
  return v;}
function torusMesh(){const v=[],N=40,M=6,R=1,r=.06;
  const P=(i,j)=>{const u=i/N*TAU,w=j/M*TAU;return[(R+r*Math.cos(w))*Math.cos(u),(R+r*Math.cos(w))*Math.sin(u),r*Math.sin(w)];};
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=P(i,j),b=P(i+1,j),c=P(i+1,j+1),d=P(i,j+1);v.push(...a,...b,...c,...a,...c,...d);}

for(let i=0;i<110;i++)motes.push({x:rnd(-34,34),y:rnd(.6,17),z:rnd(0,220),s:rnd(.05,.13),p:rnd(0,TAU)});
for(let i=0;i<46;i++)streaks.push({x:rnd(-15,15),y:rnd(.3,11),z:rnd(0,220)});

const orb=(x,y,z)=>objs.push({t:'orb',x:clamp(x,-XR,XR),y:clamp(y,YMIN+.1,YMAX-.1),z,ph:Math.random()*TAU});
const cry=(x,z,r,h)=>objs.push({t:'cry',x,z,r,h,yaw:Math.random()*TAU,tilt:rnd(-.09,.09)});
const ease=t=>t*t*(3-2*t);
const PAT={
  weave(z){const n=10+(Math.random()*5|0),ph=rnd(0,TAU),ax=rnd(1.8,3.6),cy=rnd(1.8,3.8),ay=rnd(.3,1.1),sp=4.6;
    for(let i=0;i<n;i++)orb(Math.sin(i*.5+ph)*ax,cy+Math.cos(i*.37+ph)*ay,z-i*sp);return n*sp;},
  rings(z){const n=2+(Math.random()*2|0);let x=rnd(-3,3),y=rnd(1.9,4.2),L=0;
    for(let k=0;k<n;k++){const nx=clamp(x+rnd(-3.4,3.4),-3.6,3.6),ny=clamp(y+rnd(-1.6,1.6),1.9,4.2);
      for(let i=1;i<=5;i++){const t=i/6;orb(lerp(x,nx,ease(t)),lerp(y,ny,ease(t)),z-L-t*34);}
      L+=34;x=nx;y=ny;objs.push({t:'ring',x,y,z:z-L,r:1.9,ph:Math.random()*TAU});}
    return L+6;},
  slalom(z,d){const n=4+(Math.random()*3|0),sp=lerp(27,18,d);let side=Math.random()<.5?-1:1;
    for(let i=0;i<n;i++){const x=side*rnd(1.1,3.6),tall=Math.random()<.68,h=tall?rnd(7,11):rnd(1.8,2.5);
      cry(x,z-i*sp,rnd(1.1,1.55),h);
      if(tall)orb(x-side*rnd(3,3.8),rnd(1.5,3.2),z-i*sp);else orb(x,h+1.5,z-i*sp);
      side=-side;}
    return n*sp;},
  wall(z,d){const lead=62,g=1+(Math.random()*4|0),wide=d<.45,g2=wide?(g<4?g+1:g-1):-1,slot=i=>-6+i*2.4;
    for(let i=0;i<6;i++)if(i!==g&&i!==g2)cry(slot(i)+rnd(-.15,.15),z-lead+rnd(-.6,.6),1.25,rnd(7,12));
    const gx=wide?(slot(g)+slot(g2))/2:slot(g),x0=rnd(-3,3);
    for(let i=0;i<9;i++){const t=i/6;orb(lerp(x0,gx,ease(Math.min(1,t))),2.5+Math.sin(i*.6)*.5,z-t*lead);}
    return lead+14;},
  beam(z){const lead=52,low=Math.random()<.5,y=low?1.5:4.4,cx=rnd(-2.5,2.5);
    objs.push({t:'beam',x:0,y,z:z-lead,yaw:Math.random()*TAU});
    for(let i=0;i<7;i++){const t=i/6,a=Math.sin(t*Math.PI);orb(cx+Math.sin(i*.7)*.8,low?lerp(2,4.2,a):lerp(3.7,1.5,a),z-lead-(t-.5)*40);}
    return lead+26;}
};
function spawnMore(){
  let guard=0;
  while(spawnZ>G.z-250&&guard++<12){
    const playing=G.state==='play',run=playing?G.z0-spawnZ:0,d=playing?clamp(run/5200,0,1):0,r=Math.random();let type;
    if(!playing||run<250)type=r<.62?'weave':'rings';
    else if(run<700)type=r<.28?'weave':r<.48?'rings':r<.8?'slalom':'wall';
    else type=r<.16?'weave':r<.32?'rings':r<.56?'slalom':r<.79?'wall':'beam';
    spawnZ-=PAT[type](spawnZ,d);
    spawnZ-=playing?rnd(24,36)*(1-.3*d)+G.speed*.3:rnd(30,60);
  }
}

function burst(x,y,z,col,n,spd,life,size){
  if(parts.length>620)n=Math.min(n,6);
  for(let i=0;i<n;i++){const a=Math.random()*TAU,b=Math.acos(rnd(-1,1)),s=spd*rnd(.3,1);
    parts.push({x,y,z,vx:Math.sin(b)*Math.cos(a)*s,vy:Math.cos(b)*s+1.5,vz:-G.speed*rnd(.74,1)+Math.sin(b)*Math.sin(a)*s*.6,life:life*rnd(.6,1),max:life,size:size*rnd(.6,1.3),r:col[0],g:col[1],b:col[2]});}
}
function toast(sub,main){const el=$('toast');el.innerHTML='';const s=document.createElement('small');s.textContent=sub;el.appendChild(s);el.appendChild(document.createTextNode(main));
  el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),2600);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

let lastScore=-1,lastMult=0,lastFlow=-1,lastSh=-1;
function hud(){
  const s=Math.floor(G.score);if(s!==lastScore){lastScore=s;$('score').textContent=s.toLocaleString('en-US');}
  if(G.mult!==lastMult){const up=G.mult>lastMult;lastMult=G.mult;const el=$('mult');el.textContent='x'+G.mult;if(up){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}}
  const fl=G.mult>=8?10:G.flow%10;if(fl!==lastFlow){lastFlow=fl;$('flowBar').style.width=(fl*10)+'%';}
  if(G.shields!==lastSh){lastSh=G.shields;const it=$('shields').children;for(let i=0;i<3;i++)it[i].classList.toggle('gone',i>=G.shields);}
}
function startGame(){
  if(G.state==='play')return;
  if(G.state==='over'&&G.t-G.overT<1.1)return;
  G.state='play';G.z0=G.z;G.dist=0;G.score=0;G.bonus=0;G.orbs=0;G.mult=1;G.flow=0;G.shields=3;G.inv=1;G.boost=1.3;G.run=0;G.lastOrb=-9;G.dead=false;G.hurt=false;G.ts=1;
  if(G.biome!==0)setBiome(0);G.biome=0;
  if(!ship.alive){ship.alive=true;ship.x=0;ship.y=2.6;ship.vx=ship.vy=0;}
  ship.tx=ship.x;ship.ty=ship.y;
  objs=objs.filter(o=>o.t==='orb'||o.t==='ring');
  $('title').classList.add('off');$('over').classList.add('off');$('hud').classList.remove('off');
  lastScore=-1;lastMult=0;lastFlow=-1;lastSh=-1;hud();sfxStart();
  toast('SECTOR 1',BIOMES[0].name);
}
function damage(){
  if(G.inv>0)return;
  G.shields--;G.hurt=true;G.inv=1.5;G.shake=RM?0:1;G.flash=.55;G.flashCol=[1,.2,.3];G.flow=0;G.mult=1;G.speed*=.6;G.run=0;
  sfxHit();buzz(70);
  if(G.shields<=0)G.dead=true;
}
function die(){
  G.state='over';G.overT=G.t;ship.alive=false;G.ts=.25;G.flash=.9;G.flashCol=[1,.6,.5];G.shake=RM?0:1.8;
  burst(ship.x,ship.y,G.z,[1,.85,.6],46,15,1.2,.3);burst(ship.x,ship.y,G.z,pal.accent,30,10,1,.24);
  for(const o of objs){if(o.t==='cry')burst(o.x,o.h*.5,o.z,pal.accent,8,8,.9,.22);else if(o.t==='beam')burst(0,o.y,o.z,pal.accent,10,8,.9,.22);}
  objs=objs.filter(o=>o.t==='orb'||o.t==='ring');
  const sc=Math.floor(G.score);if(sc>G.best){G.best=sc;try{localStorage.setItem('starwake.best',String(sc));}catch(e){}}
  $('final').textContent=sc.toLocaleString('en-US');$('oDist').textContent=Math.floor(G.dist).toLocaleString('en-US')+' m';
  $('oOrbs').textContent=G.orbs.toLocaleString('en-US');$('oBest').textContent=G.best.toLocaleString('en-US');
  $('hud').classList.add('off');setTimeout(()=>{if(G.state==='over')$('over').classList.remove('off');},650);
  sfxOver();buzz([90,60,160]);
}
function collect(o){
  G.orbs++;G.run=(G.t-G.lastOrb>1.3)?0:G.run+1;G.lastOrb=G.t;
  if(G.state==='play'){G.flow++;G.mult=Math.min(8,1+Math.floor(G.flow/10));G.bonus+=10*G.mult;}
  burst(o.x,o.y,o.z,pal.orb,6,5,.45,.15);sfxOrb(G.run);
}
function ringPass(o){
  o.pop=G.t;G.boost=1.7;G.flash=Math.max(G.flash,.22);G.flashCol=pal.grid.slice();
  if(G.state==='play'){G.flow+=4;G.mult=Math.min(8,1+Math.floor(G.flow/10));G.bonus+=150*G.mult;}
  for(let i=0;i<22;i++){const a=i/22*TAU;parts.push({x:o.x+Math.cos(a)*o.r,y:o.y+Math.sin(a)*o.r,z:o.z,vx:Math.cos(a)*7,vy:Math.sin(a)*7,vz:-G.speed*.9,life:.6,max:.6,size:.2,r:pal.grid[0],g:pal.grid[1],b:pal.grid[2]});}
  sfxRing();buzz(18);
}
function collide(pz,dt){
  const sz=G.z,playing=G.state==='play',alive=ship.alive;
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];
    if(o.z>sz+16){objs.splice(i,1);continue;}
    if(!alive)continue;
    const dx=o.x-ship.x;
    if(o.t==='orb'){const dz=o.z-sz;
      if(dz>-9&&dz<pz-sz+1.4){const dy=o.y-ship.y,d2=dx*dx+dy*dy;
        if(d2<7.5){const a=Math.min(1,dt*9);o.x-=dx*a;o.y-=dy*a;}
        if(dz>-1.4&&d2<2.5){collect(o);objs.splice(i,1);}}
    }else if(o.t==='cry'){const rz=o.r*.8+.35;
      if(playing&&o.z>=sz-rz&&o.z<=pz+rz&&Math.abs(dx)<o.r*.8+.36&&ship.y<o.h+.1){burst(o.x,Math.min(o.h*.55,ship.y+1),o.z,pal.accent,24,9,.8,.22);objs.splice(i,1);damage();}
    }else if(o.t==='ring'){
      if(!o.done&&o.z>=sz&&o.z<=pz){o.done=true;if(Math.hypot(dx,o.y-ship.y)<o.r*.96)ringPass(o);}
    }else if(o.t==='beam'){
      if(playing&&o.z>=sz-.5&&o.z<=pz+.5&&Math.abs(o.y-ship.y)<.8){burst(ship.x,o.y,o.z,pal.accent,24,9,.8,.22);objs.splice(i,1);damage();}
    }
  }
  if(G.dead&&G.state==='play')die();
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
    if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=4*dt;const dr=Math.exp(-dt*1.6);p.vx*=dr;p.vy*=dr;}
}

const keys={};
function update(rdt){
  G.ts+=(1-G.ts)*Math.min(1,rdt*1.4);
  const dt=rdt*G.ts;G.t+=dt;
  const playing=G.state==='play',dif=playing?Math.min(1,G.dist/5200):0;
  const target=playing?30+38*dif+(G.boost>0?15:0):(G.state==='over'?9:15);
  G.speed+=(target-G.speed)*(1-Math.exp(-dt*(playing?1.8:.9)));
  const pz=G.z;G.z-=G.speed*dt;
  G.inv=Math.max(0,G.inv-dt);G.boost=Math.max(0,G.boost-dt);G.shake*=Math.exp(-dt*5);G.flash*=Math.exp(-rdt*4.5);
  if(playing){
    const kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ky=(keys.ArrowUp||keys.w?1:0)-(keys.ArrowDown||keys.s?1:0);
    if(kx)ship.tx=clamp(ship.tx+kx*14*dt,-XR,XR);if(ky)ship.ty=clamp(ship.ty+ky*8*dt,YMIN,YMAX);
  }else if(G.state==='title'){ship.tx=Math.sin(G.t*.45)*3.1;ship.ty=2.7+Math.sin(G.t*.72);}
  else{ship.tx*=.98;ship.ty=lerp(ship.ty,2.6,.02);}
  const k=1-Math.exp(-dt*(playing?13:2.2)),ox=ship.x,oy=ship.y;
  ship.x+=(ship.tx-ship.x)*k;ship.y+=(ship.ty-ship.y)*k;
  if(dt>0){const a=Math.min(1,dt*10);ship.vx+=((ship.x-ox)/dt-ship.vx)*a;ship.vy+=((ship.y-oy)/dt-ship.vy)*a;}
  if(playing){
    G.dist=G.z0-G.z;G.score=G.dist+G.bonus;
    const bi=Math.floor(G.dist/800);
    if(bi!==G.biome){G.biome=bi;setBiome(bi%4);
      if(G.shields<3){G.shields++;toast('SHIELD RESTORED',BIOMES[bi%4].name);}else toast('SECTOR '+(bi+1),BIOMES[bi%4].name);
      sfxShield();}
    AU.level=G.dist>1900?4:G.dist>950?3:G.dist>380?2:1;
  }else AU.level=0;
  spawnMore();collide(pz,dt);
  if(ship.alive){const c=pal.grid;for(let i=0;i<2;i++)parts.push({x:ship.x+rnd(-.1,.1),y:ship.y+.04+rnd(-.08,.08),z:G.z+.6,vx:rnd(-.5,.5),vy:rnd(-.5,.5),vz:-G.speed*.5,life:.3,max:.3,size:.13,r:c[0],g:c[1],b:c[2]});}
  stepParts(dt);updPal(rdt);
  if(playing)hud();
}

const VP=new Float32Array(16),VM=new Float32Array(16),PM=new Float32Array(16),bs={};
const LIGHT=(()=>{const l=Math.hypot(-.5,.62,.42);return[-.5/l,.62/l,.42/l];})();
const u3=(l,v)=>gl.uniform3f(l,v[0],v[1],v[2]);
function pass(p,target,w,h){gl.bindFramebuffer(gl.FRAMEBUFFER,target);gl.viewport(0,0,w,h);gl.useProgram(p.p);}
function render(){
  beatInfo();
  const asp=W/H,D=Math.PI/180;

  const po=lerp(.9,6,clamp((vf-58*D)/(38*D),0,1));

  const roll=RM?0:clamp(-ship.vx*.012,-.12,.12),cam=[ex,ey,ez];

  lookAt(VM,cam,[ship.x*.86,ship.y*.74+po,G.z-14],[Math.sin(roll),Math.cos(roll),0],bs);

  gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  // terrain

  const blink=G.state==='play'&&G.inv>0&&G.hurt&&(Math.floor(G.t*16)&1);

  u3(u.uR,bs.r);u3(u.uU,bs.u);u3(u.uF,bs.f);gl.uniform2f(u.uTan,tv*asp,tv);

  for(const p of parts){const a=p.life/p.max;spr(p.x,p.y,p.z,p.size*(.4+.6*a),p.r*a*1.6,p.g*a*1.6,p.b*a*1.6,0,0);}
  for(const m of motes){const z=G.z+12-mod(G.z+12-m.z,220),a=.3+.25*Math.sin(G.t*1.3+m.p);spr(m.x,m.y,z,m.s,gr[0]*a,gr[1]*a,gr[2]*a,0,0);}

    spr(ship.x-wx,ship.y-wy,G.z+.66+len,.05,ac[0]*1.3,ac[1]*1.3,ac[2]*1.3,1,len);
    const ga=clamp(1.3-ship.y*.22,.15,1)*.22;spr(ship.x,.32,G.z,1.5,gr[0]*ga,gr[1]*ga,gr[2]*ga,0,1.8);
  }
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(sprP.p);u=sprP.u;
  gl.uniformMatrix4fv(u.uVP,false,VP);u3(u.uR,bs.r);u3(u.uU,bs.u);u3(u.uCam,cam);
  gl.bindVertexArray(sprVAO);gl.bindBuffer(gl.ARRAY_BUFFER,sprBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,SB,0,ns*9);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,ns);
  gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);

  // bloom + grade
  gl.bindVertexArray(triVAO);gl.activeTexture(gl.TEXTURE0);

/* ================= input ================= */
const ptr={down:false,x:0,y:0};
function onDown(e){
  audioOn();
  if(e.target&&e.target.closest&&e.target.closest('button'))return;
  if(G.state!=='play')startGame();
  ptr.down=true;ptr.x=e.clientX;ptr.y=e.clientY;
}
function onMove(e){
  if(G.state!=='play')return;
  const w=cssW||innerWidth,h=cssH||innerHeight;
  if(e.pointerType==='mouse'&&!ptr.down){ship.tx=clamp((e.clientX/w*2-1)*XR*1.25,-XR,XR);ship.ty=clamp(lerp(YMAX,YMIN,(e.clientY/h-.2)/.65),YMIN,YMAX);return;}
  if(!ptr.down)return;
  ship.tx=clamp(ship.tx+(e.clientX-ptr.x)/Math.min(w,620)*XR*3,-XR,XR);
  ship.ty=clamp(ship.ty-(e.clientY-ptr.y)/Math.min(h,760)*(YMAX-YMIN)*2.3,YMIN,YMAX);
  ptr.x=e.clientX;ptr.y=e.clientY;
}
function onUp(){ptr.down=false;audioOn();}
addEventListener('pointerdown',onDown);addEventListener('pointermove',onMove);addEventListener('pointerup',onUp);addEventListener('pointercancel',()=>{ptr.down=false;});
addEventListener('touchend',audioOn,{passive:true});addEventListener('click',audioOn);
document.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>{e.preventDefault();});
addEventListener('contextmenu',e=>{e.preventDefault();});
addEventListener('keydown',e=>{keys[e.key]=true;
  if(e.key===' '||e.key==='Enter'){if(document.activeElement===$('mute'))return;audioOn();if(G.state!=='play')startGame();e.preventDefault();}
  if(e.key.indexOf('Arrow')===0)e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key]=false;});
$('mute').addEventListener('click',()=>{AU.muted=!AU.muted;$('mute').setAttribute('aria-pressed',String(AU.muted));
  if(AU.ctx)AU.master.gain.setTargetAtTime(AU.muted?0:.85,AU.ctx.currentTime,.03);});
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend().catch(()=>{});else AU.ctx.resume().catch(()=>{});});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();});
canvas.addEventListener('webglcontextrestored',()=>{location.reload();});

/* ================= loop ================= */
let last=0,acc=0,frames=0;
function frame(now){
  requestAnimationFrame(frame);
  const rdt=last?Math.min((now-last)/1000,.05):.016;last=now;
  if(canvas.clientWidth!==cssW||canvas.clientHeight!==cssH)resize();
  if(ADAPT){acc+=rdt;frames++;if(frames>=90){if(acc/frames>.0235&&quality>.56){quality*=.85;W=0;resize();}acc=0;frames=0;}}
  update(rdt);render();
}
resize();updPal(0);
window.__starwake={G,ship,AU};
requestAnimationFrame(frame);
})();
