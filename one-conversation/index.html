<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/gsap.min.js"></script>
    <style>
      :root {
        --ground: #05040a;
        --ink: #f4f2ff;
        --ion: #6ff3ff;
        --gold: #ffd27a;
        --dim: #a3a3c2;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        font-family: "IBM Plex Mono", monospace;
        color: var(--ink);
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <canvas id="stage" width="1080" height="1920" data-layout-ignore></canvas>

      <div
        id="hud"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="22"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio id="music" class="clip" data-start="0" data-duration="22" data-track-index="5" data-volume="1" src="assets/music.wav"></audio>
    </div>
    <script src="lib/scene.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 22 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
